name: Market Brief

on:
  # 05:30 KST Mon-Sat = 20:30 UTC Sun-Fri (GitHub Actions는 UTC 기준)
  # 06:50 / 07:50 KST 백업: GitHub 스케줄 지연/미발화 대비, check_dup_run이 중복 방지
  schedule:
    - cron: "30 20 * * 0-5"
    - cron: "50 21 * * 0-5"
    - cron: "50 22 * * 0-5"

  # 수동 트리거 (테스트용)
  workflow_dispatch:

# 동시 실행 금지: 05:30 실행이 느려도 백업 크론(06:50/07:50)이 겹쳐 돌지 않게 직렬화.
# 앞 실행이 끝난 뒤에야 다음이 시작 → last_run.txt(중복방지)를 확인하고 스킵할 수 있음.
# cancel-in-progress: false → 진행 중 실행은 죽이지 않고 뒤 실행을 대기시킴.
concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram (coins/futures/apt/naver — data.go.kr 호출 없음)
        # send 모드: 실거래·검색JSON은 로컬(run_naver.bat)이 수집·커밋한 걸 사용.
        # data.go.kr은 해외(GitHub)에서 차단되므로 여기선 절대 호출하지 않는다.
        env:
          MB_MODE: send
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # workflow_dispatch이면 dup 체크 건너뜀 — 수동 실행은 항상 동작
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python bot.py

      - name: Inject search data into index.html
        run: python inject_data.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-${{ github.run_id }}
          path: |
            index.html
            search_data.json
          retention-days: 7

      - name: Commit & push updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only known state files (never accidentally stage secrets etc.)
          git add apt_state.json building_cache.json search_data.json index.html last_run.txt reported_dates.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: market brief $(date -u +'%Y-%m-%d')"
            # 로컬 수집기(naver_collect.py)가 그 사이 push했을 수 있으니 pull 후 push.
            # 충돌 시 우리(Actions) 쪽 상태 파일을 우선.
            git pull --no-rebase --no-edit -X ours || true
            git push || { git pull --no-rebase --no-edit -X ours || true; git push; }
          fi
